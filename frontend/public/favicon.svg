<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1f28"/>
      <stop offset="100%" stop-color="#0c0e14"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4d7c0f" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4f542"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Dark squircle background -->
  <rect x="2" y="2" width="44" height="44" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <!-- Dashed orbit ring -->
  <circle cx="24" cy="24" r="14" stroke="url(#sparkGrad)" stroke-width="1.2" stroke-dasharray="3.5 3" opacity="0.55"/>
  <!-- Cross axis lines -->
  <path d="M24 10V14M24 34V38M10 24H14M34 24H38" stroke="url(#sparkGrad)" stroke-width="1.3" stroke-linecap="round" opacity="0.45"/>
  <!-- Center 4-point star / sparkle -->
  <path d="M24 13L26.2 21.8L35 24L26.2 26.2L24 35L21.8 26.2L13 24L21.8 21.8L24 13Z" fill="url(#sparkGrad)" filter="url(#glow)"/>
  <!-- Satellite dot top-right -->
  <circle cx="35" cy="13" r="2.5" fill="#a3e635"/>
  <!-- Satellite dot bottom-left -->
  <circle cx="13" cy="35" r="2" fill="#84cc16"/>
</svg>